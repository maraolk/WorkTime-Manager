stages:
  - lint
  - test
  - build
  - deploy

image: node:24

cache:
  paths:
    - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  script:
    - npm run lint

unit_tests:
  stage: test
  script:
    - npm test -- --runInBand

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/

pages:
  stage: deploy
  script:
    - npm run build -- --base-href "/WorkTime-Manager/"
    - mkdir -p public
    - cp -r dist/worktime-manager/browser/* public/
  artifacts:
    paths:
      - public
  only:
    - main
